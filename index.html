<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>learning website</title>
    <meta name="author" content="Ebenezer Andrews Sarpong" />
    <meta
      name="description"
      content="A website with study materials and learning resources"
    />
    <meta
      name="keywords"
      content="flashcards, learning materials, studying, education"
    />
    <link rel="icon" href="./favicon.ico" />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    /> -->
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="./index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <template id="deck-template">
          <li class="card card_color_green">
            <a class="card__link" href="#"></a>
            <h3 class="card__title"></h3>
            <div class="card__row">
              <p class="card__count"></p>
              <button
                class="card__delete-btn"
                type="button"
                aria-label="delete this deck"
              ></button>
            </div>
          </li>
        </template>
        <ul class="gallery__list">
          <li class="gallery__new-deck-item">
            <button class="gallery__new-card-btn" type="button">
              + New Deck
            </button>
          </li>
        </ul>
      </section>
      <section class="gallery" id="deck-view">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <template id="flashcard-template">
          <li class="card">
            <h3 class="card__title"></h3>
            <div class="card__row">
              <button
                type="button"
                class="card__flip-btn"
                aria-label="Flip flashcard"
              ></button>
              <button
                type="button"
                class="card__delete-btn"
                aria-label="Delete flashcard"
              ></button>
            </div>
          </li>
        </template>
        <ul class="gallery__list">
          <li class="gallery__new-deck-item">
            <button class="gallery__new-card-btn" type="button">
              + New Card
            </button>
          </li>
        </ul>
      </section>
      <section class="carousel" id="carousel">
        <h2 class="carousel__title"></h2>

        <button
          class="carousel__btn carousel__btn_type_left previous-btn"
          type="button"
        ></button>

        <div class="carousel__card">
          <p class="carousel__card-text"></p>
        </div>
        <button
          class="carousel__btn carousel__btn_type_right next-btn"
          type="button"
        ></button>

        <button
          class="carousel__btn carousel__btn_type_flip carousel__flip-btn"
          type="button"
        >
          <img src="./assets/images/flip.svg" alt="Flip" />
        </button>
      </section>
      <section class="not-found" id="not-found">
        <h2 class="not-found__title">404</h2>
        <p class="not-found__text">Page not found</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Around the U.S.</p>
    </footer>
    <script src="./assets/js/index.js" type="module"></script>
  </body>
</html>
